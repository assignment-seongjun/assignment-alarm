<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제 알리미 - 공지사항</title>
  <script src="js/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
  <a class="skip-link" href="#mainContent">본문으로 이동</a>
  <div class="app-shell">
  <header class="app-header">
    <a class="brand" href="calendar.html" aria-label="과제 알리미 홈"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="5" width="14" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v3M16 3.5v3M5 10h14M9 14l2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>과제 알리미</span></a>
    <nav aria-label="주요 메뉴">
      <a href="calendar.html">대시보드</a>
      <a href="register.html">과제 등록</a>
      <a href="messages.html" class="active" aria-current="page">공지사항</a>
      <!-- AI 챗봇 메뉴는 재도입 전까지 비활성화합니다. <a href="chatbot.html">AI 챗봇</a> -->
      <a href="settings.html">설정</a>
    </nav>
    <div class="user-info">
      <div class="notification-area">
        <button class="notification-btn" id="notificationBtn" type="button" aria-expanded="false" aria-controls="notificationPanel">알림 <span class="notification-badge" id="notificationBadge">0</span></button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-panel-header">
            <strong>최근 알림</strong>
            <button class="notification-refresh-btn" id="notificationRefreshBtn" type="button">새로고침</button>
          </div>
          <div class="notification-list" id="notificationList">
            <div class="notification-empty">불러오는 중...</div>
          </div>
        </div>
      </div>
      <span class="user-name" id="userName"></span>
      <button class="logout-btn" type="button" data-logout>로그아웃</button>
    </div>
  </header>

  <main class="container" id="mainContent">
    <div class="page-heading"><div><p class="eyebrow">CLASS NOTICE</p><h1>놓치지 않는 우리 반 소식</h1><p class="page-description">학년과 반의 공지사항을 한곳에서 확인하세요.</p></div></div>
    <div class="notice-tabs" aria-label="공지 종류">
      <button type="button" class="notice-tab active" id="showGradeMsg" aria-pressed="true"><span class="tab-icon" aria-hidden="true">◎</span><span><strong>학년 공지</strong><small>학년 전체의 새로운 소식</small></span></button>
      <button type="button" class="notice-tab" id="showClassMsg" aria-pressed="false"><span class="tab-icon" aria-hidden="true">▤</span><span><strong>반 공지</strong><small>우리 반에 필요한 이야기</small></span></button>
    </div>

    <div class="card">
      <h3 id="messageTitle">전체 공지</h3>

      <div class="message-form" id="messageForm" style="display:none">
        <select aria-label="공지 종류" id="msgType" class="message-target-select">
          <option value="grade">학년 공지</option>
          <option value="class">반 공지</option>
        </select>
        <select aria-label="공지 대상 학년" id="msgTargetGrade" class="message-target-select" style="display:none"></select>
        <select aria-label="공지 대상 반" id="msgTargetClass" class="message-target-select" style="display:none"></select>
        <textarea id="msgContent" aria-label="공지 내용" maxlength="1000" placeholder="공지를 입력하세요..." rows="2"></textarea>
        <button class="btn btn-primary btn-sm" id="sendMsgBtn" type="button">보내기</button>
      </div>
      <div id="messageList"><div class="empty-state">아직 등록된 공지가 없습니다.</div></div>
    </div>
  </main>
  </div>

  <script src="js/api.js?v=16"></script>
  <script src="js/app-shell.js?v=2"></script>
  <script src="js/messages.js?v=2"></script>
</body>
</html>
